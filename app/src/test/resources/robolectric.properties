# Module-wide default Application for Robolectric-backed unit tests (@RunWith(AndroidJUnit4::class),
# which resolves to RobolectricTestRunner on the JVM). The real com.jiahan.smartcamera.MyApp installs
# the Firebase App Check provider in onCreate(), which throws under Robolectric because no default
# FirebaseApp is ever initialized there. A bare Application sidesteps that entirely.
#
# This is a net, not a dependency. The suites it was written for -- AuthScreenTest and HomeScreenTest,
# then in app/src/sharedTest -- left with their screens when auth and home became feature modules, and
# app/src/sharedTest no longer exists. The one Robolectric class left under app/src/test is
# DefaultErrorHandlerTest, which carries its own @Config(application = Application::class); an explicit
# class-level @Config always overrides this file, so it neither needs this nor is harmed by it.
#
# Keep the file anyway: it is what stops the next Robolectric test added here from booting MyApp by
# default, and it is the only way to configure one that cannot -- a `sharedTest/` suite compiles into
# androidTest too, where org.robolectric.annotation.Config does not resolve.
application=android.app.Application
